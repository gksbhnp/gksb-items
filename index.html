const KEY='gksb_dappa_demo_v2';const $=id=>document.getElementById(id);
const base=Object.fromEntries(Object.entries(catalog).map(([a,items])=>[a,items.map(name=>({id:(crypto.randomUUID?.()||String(Math.random())),name,net:'',units:'',mrp:''}))]));
let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch{}
if(!data||!data.products)data={agencies:Object.keys(base).map(name=>({name,phones:[],contacts:[]})),products:base,orders:[],nextOrder:1};
let chosen=new Set(),editing=null,orderQty=new Map();const rows=()=>Object.entries(data.products).flatMap(([agency,arr])=>(arr||[]).map(p=>({agency,p})));const id=(a,p)=>a+'\u0001'+p.id;
function persist(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){alert('Storage is full. Please back up your data.');return false}}
function money(n){if(n===''||n===undefined||n===null)return '—';let v=Number(n);return Number.isFinite(v)?v.toLocaleString('en-IN',{maximumFractionDigits:2}):'—'}
function date(p){return p.rateUpdated?new Date(p.rateUpdated).toLocaleDateString('en-GB'):'—'}
function status(t){$('status').textContent=t}
function rateLine(p){return '📅 '+date(p)+' | MRP ₹'+money(p.mrp)+' | Net ₹'+money(p.net)}
function draw(){let term=$('search').value.trim().toLowerCase(),matches=rows().filter(({p})=>p.name.toLowerCase().includes(term));$('count').textContent=matches.length+' matching items';let list=$('results');list.replaceChildren();matches.slice(0,300).forEach(({agency,p})=>{let row=document.createElement('div');row.className='item';let ck=document.createElement('input');ck.type='checkbox';ck.checked=chosen.has(id(agency,p));ck.onchange=()=>{if(ck.checked)chosen.add(id(agency,p));else chosen.delete(id(agency,p));preview()};let main=document.createElement('div');main.className='main';let name=document.createElement('div');name.className='name';name.textContent=p.name;let rate=document.createElement('div');rate.className='rate';rate.textContent=rateLine(p);main.append(name,rate);let controls=document.createElement('div');controls.className='order-controls';let key=id(agency,p);let q=orderQty.get(key)||{qty:'',unit:'pcs'};let qty=document.createElement('input');qty.type='number';qty.min='0';qty.step='any';qty.placeholder='Qty';qty.setAttribute('aria-label','Order quantity');qty.value=q.qty;qty.oninput=()=>{orderQty.set(key,{qty:qty.value,unit:unit.value});if(Number(qty.value)>0)chosen.add(key);else chosen.delete(key);ck.checked=chosen.has(key);preview()};let unit=document.createElement('select');unit.setAttribute('aria-label','Order unit');['pcs','kg','box','case','dozen','bag','packet','bundle','litre'].forEach(u=>{let op=document.createElement('option');op.value=u;op.textContent=u;unit.append(op)});unit.value=q.unit;unit.onchange=()=>{orderQty.set(key,{qty:qty.value,unit:unit.value});preview()};controls.append(qty,unit);let edit=document.createElement('button');edit.className='alt';edit.textContent='✏️';edit.onclick=()=>openEdit(agency,p);row.append(ck,main,controls,edit);list.append(row)});preview()}
function openEdit(agency,p){editing={agency,p};$('editTitle').textContent=p?'Edit Item':'Add Item';$('itemName').value=p?.name||'';$('mrp').value=p?.mrp||'';$('net').value=p?.net||'';$('units').value=p?.units||'';$('edit').showModal()}
$('add').onclick=()=>openEdit('_GKSB_MASTER_',null);$('cancel').onclick=()=>$('edit').close();$('saveEdit').onclick=()=>{let name=$('itemName').value.trim();if(!name){alert('Enter item name');return}let {agency,p}=editing;let changes={name,mrp:$('mrp').value,net:$('net').value,units:$('units').value};if(changes.units&&!(Number(changes.units)>0)){alert('Enter a valid quantity');return}if(p){let old={mrp:p.mrp||'',net:p.net||'',units:p.units||'',updated:p.rateUpdated||''};let changed=Object.entries(changes).some(([k,v])=>String(p[k]||'')!==String(v));if(changed){p.rateHistory=p.rateHistory||[];if(old.mrp||old.net||old.units)p.rateHistory.push(old);Object.assign(p,changes);p.rateUpdated=new Date().toISOString()}}else{data.products[agency] ||= [];data.products[agency].push({id:crypto.randomUUID?.()||String(Math.random()),...changes,rateUpdated:new Date().toISOString()})}if(!persist())return;$('edit').close();draw();status('Item saved')};
function formattedName(name){return String(name).replace(/\{([^{}]+)\}/g,'$1').replace(/\b(\d+(?:\.\d+)?\s*(?:kg|kgs|gm|gms|g|ml|ltr|litre|litres|l))\b/gi,'{$1}').replace(/\{(\d+(?:\.\d+)?\s*(?:kg|kgs|gm|gms|g|ml|ltr|litre|litres|l))\}/gi,(_,v)=>'{'+v.replace(/\s+/g,'').toLowerCase()+'}');}
function buildText(){let selected=rows().filter(({agency,p})=>chosen.has(id(agency,p))&&Number(orderQty.get(id(agency,p))?.qty)>0);if(!selected.length)return '';let s='📦 *GKSB ORDER*\n\n';selected.forEach(({agency,p},i)=>{let q=orderQty.get(id(agency,p));s+=(i+1)+'. '+formattedName(p.name)+' '+(q.unit==='kg'?'{'+q.qty+'kg}':'['+q.qty+' '+q.unit+']')+' ಕಳ್ಸಿ\n'});return s+'\nTotal Items: '+selected.length+'\n\n   ✦ ━━━━━━━━━ ✦\n       G K S B\n   ✦ ━━━━━━━━━ ✦'}

function preview(){$('preview').textContent=buildText()||'Enter quantity beside an item to prepare WhatsApp text.'}
async function copyText(){let s=buildText();if(!s){status('Enter quantity for at least one item first');return}try{await navigator.clipboard.writeText(s);status('WhatsApp text copied!')}catch{let t=document.createElement('textarea');t.value=s;document.body.append(t);t.select();let ok=document.execCommand('copy');t.remove();status(ok?'WhatsApp text copied!':'Copy failed. Select text from preview.')}}
$('copy').onclick=copyText;$('clear').onclick=()=>{chosen.clear();orderQty.clear();draw()};$('search').oninput=draw;document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='c'&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)&&!$('edit').open){e.preventDefault();copyText()}});
$('backup').onclick=()=>{let blob=new Blob([JSON.stringify({type:'GKSB-DAPPA-BACKUP',version:2,date:new Date().toISOString(),data},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='GKSB-Items-Backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('restore').onclick=async()=>{let f=$('restoreFile').files[0];if(!f)return alert('Choose a backup first');try{let b=JSON.parse(await f.text()),d=b.data||b;if(!d.products||typeof d.products!=='object')throw Error('Invalid backup');if(!confirm('Restore this backup? It will replace currently saved data.'))return;data=d;persist();chosen.clear();orderQty.clear();draw();status('Backup restored')}catch(e){alert('Could not restore: '+e.message)}};
draw();
